name: Build TOOL ERI NGUYEN IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'EriMail-main.zip'
      - '.github/workflows/build-ipa.yml'
      - 'EriMail/ToolEriApp.swift'
permissions:
  contents: read
concurrency:
  group: eri-mail-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted build-source
          unzip -oq EriMail-main.zip -d extracted
          test -f extracted/EriMail-main/gmail_fake_eri_mod_ios_cloud_build.zip
          unzip -oq extracted/EriMail-main/gmail_fake_eri_mod_ios_cloud_build.zip -d build-source
          # Replace legacy interface with the new five-feature application.
          cp EriMail/ToolEriApp.swift build-source/EriMail/ContentView.swift
          # Confirm the new UI is present and the old views are not appended.
          grep -q 'struct ContentView: View' build-source/EriMail/ContentView.swift
          grep -q 'struct SignIPAView: View' build-source/EriMail/ContentView.swift

          test -f build-source/EriMail.xcodeproj/project.pbxproj
          test -f build-source/build_ipa.sh
      - name: Set app display name safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path("build-source")
          for plist in root.rglob("Info.plist"):
              if ".xcode-build" in str(plist):
                  continue
              try:
                  with plist.open("rb") as f:
                      data = plistlib.load(f)
              except Exception:
                  continue
              if isinstance(data, dict) and ("CFBundleExecutable" in data or "CFBundleIdentifier" in data):
                  data["CFBundleDisplayName"] = "TOOL ERI NGUYỄN"
                  with plist.open("wb") as f:
                      plistlib.dump(data, f)
                  print("Updated", plist)
          PY
          plutil -lint build-source/EriMail.xcodeproj/project.pbxproj
      - name: Build unsigned IPA
        run: |
          cd build-source
          bash build_ipa.sh unsigned
      - name: Verify IPA
        run: |
          test -s "build-source/gmail fake eri mod.ipa"
          unzip -tq "build-source/gmail fake eri mod.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: TOOL-ERI-NGUYEN-unsigned-IPA
          path: build-source/gmail fake eri mod.ipa
          if-no-files-found: error
          retention-days: 14
