name: Verify live ERI OTA manifests
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-live-ios-manifests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-ios-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify XML MIME type and signed app URLs on ERI Store domain
        run: |
          python3 - <<'PY'
          import json, plistlib, urllib.request
          base="https://eri-store-web.onrender.com"
          with urllib.request.urlopen(base+"/install-tools.json",timeout=30) as response:
              catalog=json.load(response)
          all_entries=[item for kind in ("ksign","esign") for item in catalog[kind]]
          assert len(catalog["ksign"])==17 and len(catalog["esign"])==17
          assert len(set(item["url"] for item in all_entries))==34
          for entry in all_entries:
              url=entry["url"].split("download-manifest&url=",1)[1]
              assert url.startswith(base+"/plists/") and url.endswith(".xml"),url
              slug=url.rsplit("/",1)[1].removesuffix(".xml")
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 ERI-Installer-QA"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  mime=response.headers.get_content_type()
                  data=response.read(100000)
                  print(url,"status",response.status,"MIME",mime,"length",len(data),flush=True)
                  assert response.status==200
                  assert mime in ("application/xml","text/xml","application/x-plist"), f"Incorrect manifest MIME: {mime}"
                  manifest=plistlib.loads(data)
                  packages=[asset["url"] for item in manifest["items"] for asset in item["assets"] if asset["kind"]=="software-package"]
                  assert packages and all(p.startswith("https://website.khoindvn.io.vn/apps/") for p in packages)
          print("LIVE VERIFIED: all 34 ERI-hosted OTA manifests have correct XML MIME, metadata and original IPA URLs")
          for suffix in ("/?certqa=1", "/app.js?certqa=1", "/free-certificates.js?certqa=1"):
              req=urllib.request.Request(base+suffix,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  assert response.status==200
                  text=response.read().decode("utf-8")
              if suffix.startswith("/?"):
                  assert text.count('data-kind="certificate"')==1
                  assert 'data-kind="certfree"' not in text
                  assert 'id="certificate-subtabs"' in text
                  assert 'data-cert-mode="free"' in text
                  assert 'data-cert-mode="paid"' in text
                  assert 'id="ipa-sign-server"' in text and 'id="ipa-sign-iphone"' in text
              elif "app.js" in suffix:
                  assert 'openCategory("certificate",tab.dataset.certMode)' in text
                  assert 'freeCertificates=category==="certificate"&&certMode==="free"' in text
              else:
                  assert 'install.setAttribute("href",item.url)' in text
                  assert 'product--certificate eri-free-card' in text
          print("LIVE VERIFIED: single Chứng chỉ category with FREE/BÁN")
          with urllib.request.urlopen(base+"/sign-jobs.js?verify=uploadwhole1",timeout=30) as response:
              assert response.status==200
              js=response.read().decode("utf-8")
          assert 'xhr.open("POST", API + "/api/v1/tools/ipa/sign", true);' in js
          assert 'xhr.send(payload);' in js
          assert 'payload.append("ipa", ipa, ipa.name);' in js
          assert 'putChunk(' not in js and '/sign-jobs/' not in js
          assert 'function uploadWholeIPA(form)' in js
          with urllib.request.urlopen(base+"/?verify=uploadwhole1",timeout=30) as response:
              live_html=response.read().decode("utf-8")
          assert '/sign-jobs.js?v=20261115uploadwhole1' in live_html
          assert 'data-sign-mode="iphone"' not in live_html
          print("LIVE VERIFIED: one whole-IPA HTTPS upload, no 2-MB chunk requests")
          PY
