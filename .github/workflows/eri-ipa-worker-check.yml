name: ERI IPA worker checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'web/eri-store/decrypt-store.js'
      - '.github/workflows/eri-ipa-worker-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt httpx
      - name: Validate Python modules
        run: python -m compileall -q backend
      - name: Test auto ipatool acquisition and FairPlay rejection
        run: python backend/test_eri_ipatool_auto.py
      - name: Test approved ERI HTTPS source feed
        run: python backend/test_eri_source_feed.py
