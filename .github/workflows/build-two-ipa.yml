name: Build ERI ADMIN and ERI STORE unsigned IPAs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/ERIAdmin/**'
      - 'apps/ERIStore/**'
      - '.github/workflows/build-two-ipa.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ERIAdmin
            bundle: com.eringuyen.admin
            display: ERI ADMIN
          - app: ERIStore
            bundle: com.eringuyen.store
            display: ERI STORE
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        shell: bash
        env:
          APP: ${{ matrix.app }}
          BUNDLE: ${{ matrix.bundle }}
          DISPLAY: ${{ matrix.display }}
        run: |
          set -euo pipefail
          mkdir -p build-project/Sources
          cp "apps/$APP/$APP"App.swift build-project/Sources/App.swift
          python3 - <<'PY'
          import os, pathlib
          app, bundle, display = (os.environ[x] for x in ("APP", "BUNDLE", "DISPLAY"))
          content = f"""name: {app}
          options:
            deploymentTarget:
              iOS: '15.0'
          targets:
            {app}:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: {bundle}
                  PRODUCT_NAME: {app}
                  INFOPLIST_KEY_CFBundleDisplayName: "{display}"
                  GENERATE_INFOPLIST_FILE: YES
                  SWIFT_VERSION: '5.0'
                  TARGETED_DEVICE_FAMILY: '1,2'
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          """
          pathlib.Path("build-project/project.yml").write_text(content)
          PY
          cd build-project
          xcodegen generate
      - name: Build iOS device app without signing
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          cd build-project
          xcodebuild -project "$APP.xcodeproj" -scheme "$APP" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath derived CODE_SIGNING_ALLOWED=NO build
          test -d "derived/Build/Products/Release-iphoneos/$APP.app"
      - name: Package unsigned IPA
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p payload/Payload
          cp -R "build-project/derived/Build/Products/Release-iphoneos/$APP.app" payload/Payload/
          (cd payload && zip -qry "../$APP-unsigned.ipa" Payload)
          unzip -tq "$APP-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-unsigned-IPA
          path: ${{ matrix.app }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
