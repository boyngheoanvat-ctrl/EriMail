name: Build ERI STORE APK and both iOS IPAs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/ERIAdmin/**'
      - 'apps/ERIStore/**'
      - 'apps/ERIStoreAndroid/**'
      - 'backend/**'
      - '.github/workflows/build-two-ipa.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: apps/ERIStoreAndroid
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug
      - name: Prepare named APK file
        run: cp apps/ERIStoreAndroid/app/build/outputs/apk/debug/app-debug.apk ERIStore.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ERIStore-Android-APK
          path: ERIStore.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ERIAdmin
            bundle: com.eringuyen.admin
            display: ERI ADMIN
          - app: ERIStore
            bundle: com.eringuyen.store
            display: ERI STORE
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        shell: bash
        env:
          APP: ${{ matrix.app }}
          BUNDLE: ${{ matrix.bundle }}
          DISPLAY: ${{ matrix.display }}
        run: |
          set -euo pipefail
          mkdir -p build-project/Sources
          cp "apps/$APP/$APP"App.swift build-project/Sources/App.swift
          python3 - <<'PY'
          import os, pathlib, textwrap
          app, bundle, display = (os.environ[x] for x in ("APP", "BUNDLE", "DISPLAY"))
          content = "\n".join([
              f"name: {app}",
              "options:",
              "  deploymentTarget:",
              "    iOS: '16.0'",
              "targets:",
              f"  {app}:",
              "    type: application",
              "    platform: iOS",
              "    sources:",
              "      - Sources",
              "    settings:",
              "      base:",
              f"        PRODUCT_BUNDLE_IDENTIFIER: {bundle}",
              f"        PRODUCT_NAME: {app}",
              f"        INFOPLIST_KEY_CFBundleDisplayName: '{display}'",
              "        GENERATE_INFOPLIST_FILE: YES",
              "        INFOPLIST_KEY_UILaunchScreen_Generation: YES",
              "        INFOPLIST_KEY_UIRequiresFullScreen: YES",
              "        SWIFT_VERSION: '5.0'",
              "        TARGETED_DEVICE_FAMILY: '1,2'",
              "        CODE_SIGNING_ALLOWED: NO",
              "        CODE_SIGNING_REQUIRED: NO",
          ]) + "\n"
          pathlib.Path("build-project/project.yml").write_text(content)
          PY
          cd build-project
          xcodegen generate
      - name: Check Swift source syntax
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse build-project/Sources/App.swift
      - name: Build iOS device app without signing
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          cd build-project
          xcodebuild -project "$APP.xcodeproj" -scheme "$APP" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath derived CODE_SIGNING_ALLOWED=NO build
          test -d "derived/Build/Products/Release-iphoneos/$APP.app"
      - name: Verify full-screen iOS launch configuration
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          app = os.environ["APP"]
          path = Path("build-project/derived/Build/Products/Release-iphoneos") / f"{app}.app" / "Info.plist"
          with path.open("rb") as handle:
              data = plistlib.load(handle)
          assert isinstance(data.get("UILaunchScreen"), dict), "Missing modern launch screen"
          assert data.get("UIRequiresFullScreen") is True, "Full-screen support not enabled"
          print(f"{app}: native full-screen configuration verified")
          PY
      - name: Package unsigned IPA
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p payload/Payload
          cp -R "build-project/derived/Build/Products/Release-iphoneos/$APP.app" payload/Payload/
          (cd payload && zip -qry "../$APP-unsigned.ipa" Payload)
          unzip -tq "$APP-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-unsigned-IPA
          path: ${{ matrix.app }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
  backend-check:
    name: Validate private upload API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source
        run: python -m py_compile backend/app.py
      - name: Install API dependencies
        run: pip install -r backend/requirements.txt httpx
      - name: Verify secure admin upload and public catalog
        working-directory: backend
        env:
          ERI_ADMIN_KEY: test-ci-admin-key-please-replace-1234567890
          ERI_DB_PATH: /tmp/eri-ci.sqlite3
          ERI_UPLOAD_DIR: /tmp/eri-ci-private-uploads
          ERI_PAYMENT_MODE: static_momo
        run: |
          python - <<'PY'
          import io
          import zipfile
          from fastapi.testclient import TestClient
          from app import app
          client = TestClient(app)
          fields = {"name": "AI test item", "description": "CI validation", "price_vnd": "10000"}
          upload = {"upload": ("example.txt", b"private-ci-test-only", "text/plain")}
          assert client.post("/api/v1/admin/uploads/ai", data=fields, files=upload).status_code == 403
          response = client.post("/api/v1/admin/uploads/ai", data=fields, files=upload,
                                 headers={"X-ERI-Admin-Key": "test-ci-admin-key-please-replace-1234567890"})
          assert response.status_code == 201, response.text
          public = client.get("/api/v1/products")
          assert public.status_code == 200
          assert any(x["name"] == "AI test item" for x in public.json()["items"])
          assert "private-ci-test-only" not in public.text
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, "w") as zipped:
              zipped.writestr("Payload/Demo.app/Info.plist", "<plist/>")
          ipa = client.post("/api/v1/admin/uploads/ipa",
                            data={"name": "Demo", "price_vnd": "12000", "version": "1.0",
                                  "bundle_id": "com.eri.demo", "authorized": "true"},
                            files={"upload": ("demo.ipa", buffer.getvalue(), "application/octet-stream")},
                            headers={"X-ERI-Admin-Key": "test-ci-admin-key-please-replace-1234567890"})
          assert ipa.status_code == 201, ipa.text
          assert "download_url" not in client.get("/api/v1/mods").text
          # Large files are transferred in small authenticated requests.
          import plistlib
          zip_data = io.BytesIO()
          with zipfile.ZipFile(zip_data, "w") as package:
              package.writestr("Payload/Example.app/Info.plist", plistlib.dumps({
                  "CFBundleIdentifier": "com.example.app",
                  "CFBundleShortVersionString": "6.4",
              }))
          content = zip_data.getvalue()
          config = {
              "kind": "ipa", "filename": "example.ipa",
              "size_bytes": len(content), "name": "Chunked IPA",
              "description": "Automatically inspected metadata",
              "price_vnd": 22000, "authorized": True
          }
          headers = {"X-ERI-Admin-Key": "test-ci-admin-key-please-replace-1234567890"}
          assert client.post("/api/v1/admin/upload-sessions", json=config).status_code == 403
          began = client.post("/api/v1/admin/upload-sessions", json=config, headers=headers)
          assert began.status_code == 201, began.text
          session_id = began.json()["upload_id"]
          url = "/api/v1/admin/upload-sessions/" + session_id
          middle = len(content) // 2
          wrong = client.put(url, content=content[:middle], headers={**headers, "X-ERI-Upload-Offset": "3"})
          assert wrong.status_code == 409, wrong.text
          first = client.put(url, content=content[:middle], headers={**headers, "X-ERI-Upload-Offset": "0"})
          assert first.status_code == 200, first.text
          assert first.json()["offset"] == middle
          assert client.get(url, headers=headers).json()["offset"] == middle
          second = client.put(url, content=content[middle:],
                              headers={**headers, "X-ERI-Upload-Offset": str(middle)})
          assert second.status_code == 200, second.text
          done = client.post(url + "/complete", headers=headers)
          assert done.status_code == 201, done.text
          mods = client.get("/api/v1/mods").json()["items"]
          item = next(x for x in mods if x["name"] == "Chunked IPA")
          assert item["description"] == "Automatically inspected metadata"
          assert item["version"] == "6.4"
          assert item["bundle_id"] == "com.example.app"
          assert "download_url" not in str(item)
          # Admin-only MoMo QR linking; customer orders display the real configured image.
          png = (b"\x89PNG\r\n\x1a\n" + b"\x00\x00\x00\rIHDR" +
                 (256).to_bytes(4, "big") + (256).to_bytes(4, "big") +
                 b"\x08\x02\x00\x00\x00" + b"\x00\x00\x00\x00")
          assert client.post("/api/v1/admin/payment/momo", files={
              "qr": ("momo.png", png, "image/png")
          }).status_code == 403
          linked = client.post("/api/v1/admin/payment/momo",
                               files={"qr": ("momo.png", png, "image/png")},
                               headers=headers)
          assert linked.status_code == 200, linked.text
          qr = client.get("/api/v1/payment/momo-qr")
          assert qr.status_code == 200 and qr.content == png
          assert qr.headers["content-type"].startswith("image/png")
          assert client.get("/api/v1/admin/payment/momo", headers=headers).json()["linked"] is True
          # Every customer must register or log in; orders are never anonymous.
          register = client.post("/api/v1/auth/register", json={
              "username": "customer_one", "password": "AnExampleStrongPassword2026!",
              "display_name": "Khách thử nghiệm", "contact": "zalo:example_contact"
          })
          assert register.status_code == 201, register.text
          token = register.json()["token"]
          assert len(token) > 40
          customer_headers = {"Authorization": "Bearer " + token}
          assert client.post("/api/v1/auth/register", json={
              "username": "CUSTOMER_ONE", "password": "AnExampleStrongPassword2026!",
              "display_name": "Duplicated", "contact": "zalo:example_contact"
          }).status_code == 409
          assert client.post("/api/v1/auth/login", json={
              "username": "customer_one", "password": "wrongpass"
          }).status_code == 401
          login = client.post("/api/v1/auth/login", json={
              "username": "customer_one", "password": "AnExampleStrongPassword2026!"
          })
          assert login.status_code == 200
          assert login.json()["customer"]["display_name"] == "Khách thử nghiệm"
          assert client.get("/api/v1/auth/me", headers=customer_headers).status_code == 200
          assert client.post("/api/v1/orders", json={
              "kind": "mod", "product_id": item["id"]
          }).status_code == 401

          # Admin publishes AI Plus and certificate listings WITHOUT pre-uploading files.
          ai = client.post("/api/v1/admin/products", headers=headers, json={
              "name": "AI Plus theo đơn", "description": "Giao thủ công",
              "price_vnd": 20000
          })
          cert = client.post("/api/v1/admin/certificates", headers=headers, json={
              "name": "Chứng chỉ theo đơn", "issuer": "Chưa xác định",
              "description": "Giao thủ công", "price_vnd": 10000
          })
          assert ai.status_code == 201 and cert.status_code == 201
          for category, product_id in [
              ("mod", item["id"]), ("ai", ai.json()["id"]),
              ("certificate", cert.json()["id"])
          ]:
              checkout = client.post("/api/v1/orders", json={
                  "kind": category, "product_id": product_id
              }, headers=customer_headers)
              assert checkout.status_code == 201, checkout.text
              assert checkout.json()["qr_url"] == "/api/v1/payment/momo-qr"
              assert "buyer_contact" not in checkout.text
              order_id = checkout.json()["id"]
              assert client.get("/api/v1/orders/" + order_id).status_code == 401
              assert client.get("/api/v1/orders/" + order_id, headers=customer_headers).status_code == 200

          mine = client.get("/api/v1/me/orders", headers=customer_headers)
          assert mine.status_code == 200 and len(mine.json()["items"]) == 3
          assert set(x["kind"] for x in mine.json()["items"]) == {"mod", "ai", "certificate"}
          assert "buyer_contact" not in mine.text

          second = client.post("/api/v1/auth/register", json={
              "username": "customer_two", "password": "SecondUserStrongPassword2026!",
              "display_name": "Khách khác", "contact": "zalo:another_contact"
          })
          assert second.status_code == 201
          second_headers = {"Authorization": "Bearer " + second.json()["token"]}
          assert client.get("/api/v1/me/orders", headers=second_headers).json()["items"] == []
          assert client.get("/api/v1/orders/" + order_id, headers=second_headers).status_code == 404

          admin_orders = client.get("/api/v1/admin/orders", headers=headers)
          assert admin_orders.status_code == 200
          assert any(
              x["buyer_username"] == "customer_one" and
              x["buyer_contact"] == "zalo:example_contact"
              for x in admin_orders.json()["items"]
          )
          assert client.get("/api/v1/admin/orders", headers=customer_headers).status_code == 403

          # Admin alone confirms payment and marks items as delivered.
          paid = client.post("/api/v1/admin/orders/" + order_id + "/status",
                             headers=headers, json={
                  "status": "paid", "transaction_reference": "MOMO_TEST_123456"
              })
          assert paid.status_code == 200, paid.text
          fulfilled = client.post("/api/v1/admin/orders/" + order_id + "/status",
                                  headers=headers, json={"status": "fulfilled"})
          assert fulfilled.status_code == 200, fulfilled.text
          assert client.get("/api/v1/orders/" + order_id,
                            headers=customer_headers).json()["status"] == "fulfilled"
          logged_out = client.post("/api/v1/auth/logout", headers=customer_headers)
          assert logged_out.status_code == 200
          assert client.get("/api/v1/me/orders", headers=customer_headers).status_code == 401
          # Deletion is protected and does not disclose private file locations.
          path = "/api/v1/admin/catalog/ipa/" + str(item["id"])
          assert client.delete(path).status_code == 403
          listed = client.get("/api/v1/admin/catalog/ipa", headers=headers)
          assert listed.status_code == 200
          assert any(x["id"] == item["id"] for x in listed.json()["items"])
          deleted = client.delete(path, headers=headers)
          assert deleted.status_code == 200, deleted.text
          assert all(x["id"] != item["id"] for x in client.get("/api/v1/mods").json()["items"])
          assert client.delete("/api/v1/admin/payment/momo", headers=headers).status_code == 200
          assert client.get("/api/v1/payment/momo-qr").status_code == 404
          print("Protected QR linking, catalog deletion, chunk uploads and catalog: OK")
          PY
  package-all:
    name: Bundle all three apps
    needs: [android, ios, backend-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK and both IPAs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all three files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/ERIStore.apk
          test -s dist/ERIStore-unsigned.ipa
          test -s dist/ERIAdmin-unsigned.ipa
          ls -lah dist
      - name: Upload all three in one download
        uses: actions/upload-artifact@v4
        with:
          name: ERI-ALL-3-APPS
          path: |
            dist/ERIStore.apk
            dist/ERIStore-unsigned.ipa
            dist/ERIAdmin-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
