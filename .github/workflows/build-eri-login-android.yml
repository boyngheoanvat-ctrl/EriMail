name: ERI Login Android Gate DEX
on:
  push:
    branches: [eri-login-dylib-injector]
    paths:
      - "android/ERILoginGate/**"
      - "tools/LOGIN.py"
      - ".github/workflows/build-eri-login-android.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate injection Python script
        run: |
          set -euo pipefail
          python -m py_compile tools/LOGIN.py
      - name: Build Android login classes.dex
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PLATFORM="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          D8="$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -1)"
          test -f "$PLATFORM" || (echo "Missing Android SDK platform" && exit 1)
          test -x "$D8" || (echo "Missing Android D8" && exit 1)
          mkdir -p build/classes build/dex
          javac -source 8 -target 8 -cp "$PLATFORM" -d build/classes \
            android/ERILoginGate/src/vn/eri/login/ERILoginActivity.java
          "$D8" --min-api 23 --lib "$PLATFORM" --output build/dex \
            build/classes/vn/eri/login/ERILoginActivity.class
          test -s build/dex/classes.dex
          cp build/dex/classes.dex build/ERIAndroidGate.dex
          python - <<'PY'
          from pathlib import Path
          b=Path('build/ERIAndroidGate.dex').read_bytes()
          assert b[:3]==b'dex', 'Missing DEX magic'
          print('ERI Android Gate DEX',len(b),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ERI-Android-Login-DEX
          path: build/ERIAndroidGate.dex
          retention-days: 30
