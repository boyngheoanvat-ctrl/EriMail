name: Build ERI ADMIN IPA and validate ERI STORE Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/ERIAdmin/**'
      - 'backend/**'
      - 'web/eri-store/**'
      - '.github/workflows/eri-admin-web.yml'
permissions:
  contents: read
jobs:
  admin-ipa:
    name: Build ERI ADMIN unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-project/Sources
          cp apps/ERIAdmin/ERIAdminApp.swift build-project/Sources/App.swift
          cat > build-project/project.yml <<'EOF'
          name: ERIAdmin
          options:
            deploymentTarget:
              iOS: '16.0'
          targets:
            ERIAdmin:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.eringuyen.admin
                  PRODUCT_NAME: ERIAdmin
                  INFOPLIST_KEY_CFBundleDisplayName: 'ERI ADMIN'
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIRequiresFullScreen: YES
                  SWIFT_VERSION: '5.0'
                  TARGETED_DEVICE_FAMILY: '1,2'
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF
          cd build-project
          xcodegen generate
      - name: Build unsigned iOS Admin
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse build-project/Sources/App.swift
          cd build-project
          xcodebuild -project ERIAdmin.xcodeproj -scheme ERIAdmin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath derived CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          test -d build-project/derived/Build/Products/Release-iphoneos/ERIAdmin.app
          mkdir -p payload/Payload
          cp -R build-project/derived/Build/Products/Release-iphoneos/ERIAdmin.app payload/Payload/
          (cd payload && zip -qry ../ERIAdmin-unsigned.ipa Payload)
          unzip -tq ERIAdmin-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ERIAdmin-unsigned-IPA
          path: ERIAdmin-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
  backend-check:
    name: Validate product pricing and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile backend/app.py
      - run: pip install -r backend/requirements.txt httpx
      - name: Test Mod Game original price and AI/Certificate 30% markup
        working-directory: backend
        env:
          ERI_ADMIN_KEY: ci-test-admin-secret-123456789-0123456789
          ERI_DB_PATH: /tmp/eri-ci-pricing.sqlite3
          ERI_PAYMENT_MODE: static_momo
          ERI_CORS_ORIGINS: https://eri-store-web.onrender.com
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app
          client = TestClient(app)
          h = {"X-ERI-Admin-Key": "ci-test-admin-secret-123456789-0123456789"}
          m = client.post("/api/v1/admin/ipa", headers=h, json={
              "name":"Mod Example", "version":"1.0", "bundle_id":"com.eri.example",
              "download_url":"https://example.org/test.ipa", "sha256":"a"*64,
              "authorized":True, "price_vnd":300000
          })
          a = client.post("/api/v1/admin/products", headers=h, json={
              "name":"AI Example", "description":"Giao sau khi thanh toán", "price_vnd":100000
          })
          c = client.post("/api/v1/admin/certificates", headers=h, json={
              "name":"Cert Example", "issuer":"Seller", "description":"Giao thủ công",
              "price_vnd":200000
          })
          assert all(x.status_code == 201 for x in (m,a,c)), (m.text,a.text,c.text)
          assert client.get("/api/v1/mods").json()["items"][0]["price_vnd"] == 300000
          assert client.get("/api/v1/products").json()["items"][0]["price_vnd"] == 130000
          assert client.get("/api/v1/certificates").json()["items"][0]["price_vnd"] == 260000
          register = client.post("/api/v1/auth/register", json={
              "username":"testbuyer", "password":"LongSecurePassword2026!",
              "display_name":"Khách kiểm thử", "contact":"Zalo: testbuyer"
          })
          assert register.status_code == 201, register.text
          auth = {"Authorization":"Bearer " + register.json()["token"]}
          for kind, item, amount in [("mod",m,300000),("ai",a,130000),("certificate",c,260000)]:
              order = client.post("/api/v1/orders", headers=auth,
                                  json={"kind":kind,"product_id":item.json()["id"]})
              assert order.status_code == 201, order.text
              assert order.json()["amount_vnd"] == amount, (kind,order.text)
          print("Mod Game original price; AI and certificate 30% markup: OK")
          PY
  web-check:
    name: Validate website and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node --check web/eri-store/app.js
          python3 -m json.tool web/eri-store/manifest.webmanifest >/dev/null
          test -s web/eri-store/index.html
          test -s web/eri-store/styles.css
          test -s web/eri-store/icon.svg
          test -s web/eri-store/service-worker.js
          node --check web/eri-store/service-worker.js

  live-smoke:
    name: Check deployed ERI STORE and API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live API routes, PWA and CORS preflight
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error
          api = "https://eri-api-dag8.onrender.com"
          site = "https://eri-store-web.onrender.com"
          def fetch(url, method="GET", headers=None):
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, method=method, headers=headers or {})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return response.status, dict(response.headers), response.read()
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(8)
              raise RuntimeError("Remote service not reachable: " + str(last))
          code, _, body = fetch(api + "/health")
          assert code == 200 and json.loads(body)["status"] == "ok"
          _, _, schema_body = fetch(api + "/openapi.json")
          endpoints = json.loads(schema_body)["paths"]
          for route in [
              "/api/v1/auth/register", "/api/v1/auth/login",
              "/api/v1/auth/me", "/api/v1/me/orders",
              "/api/v1/orders", "/api/v1/payment/momo-qr"
          ]:
              assert route in endpoints, route
          preflight_headers = {
              "Origin": site,
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "content-type,authorization"
          }
          code, headers, _ = fetch(api + "/api/v1/auth/register",
                                   method="OPTIONS", headers=preflight_headers)
          assert code == 200, code
          allow = {k.lower(): v for k, v in headers.items()}
          assert allow.get("access-control-allow-origin") == site, allow
          assert "POST" in allow.get("access-control-allow-methods", ""), allow
          assert "authorization" in allow.get("access-control-allow-headers", "").lower(), allow
          _, _, home = fetch(site + "/")
          assert b"ERI STORE" in home
          _, _, manifest = fetch(site + "/manifest.webmanifest")
          assert json.loads(manifest)["display"] == "standalone"
          print("Live website, API auth routes, and browser CORS preflight: OK")
          PY
