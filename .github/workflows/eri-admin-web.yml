name: Build ERI ADMIN IPA and validate ERI STORE Web
on:
  workflow_dispatch:
  push:
    branches: [main, feature/mod-free-paid]
    paths:
      - 'apps/ERIAdmin/**'
      - 'backend/**'
      - 'web/eri-store/**'
      - '.github/workflows/eri-admin-web.yml'
permissions:
  contents: read
jobs:
  admin-ipa:
    name: Build ERI ADMIN unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-project/Sources
          cp apps/ERIAdmin/ERIAdminApp.swift build-project/Sources/App.swift
          cat > build-project/project.yml <<'EOF'
          name: ERIAdmin
          options:
            deploymentTarget:
              iOS: '16.0'
          targets:
            ERIAdmin:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.eringuyen.admin
                  PRODUCT_NAME: ERIAdmin
                  INFOPLIST_KEY_CFBundleDisplayName: 'ERI ADMIN'
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIRequiresFullScreen: YES
                  SWIFT_VERSION: '5.0'
                  TARGETED_DEVICE_FAMILY: '1,2'
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF
          cd build-project
          xcodegen generate
      - name: Build unsigned iOS Admin
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse build-project/Sources/App.swift
          cd build-project
          xcodebuild -project ERIAdmin.xcodeproj -scheme ERIAdmin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath derived CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          test -d build-project/derived/Build/Products/Release-iphoneos/ERIAdmin.app
          mkdir -p payload/Payload
          cp -R build-project/derived/Build/Products/Release-iphoneos/ERIAdmin.app payload/Payload/
          (cd payload && zip -qry ../ERIAdmin-unsigned.ipa Payload)
          unzip -tq ERIAdmin-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ERIAdmin-unsigned-IPA
          path: ERIAdmin-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
  backend-check:
    name: Validate product pricing and API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile backend/app.py
      - run: pip install -r backend/requirements.txt httpx
      - name: Test Mod Game original price and AI/Certificate 30% markup
        working-directory: backend
        env:
          ERI_ADMIN_KEY: ci-test-admin-secret-123456789-0123456789
          ERI_DB_PATH: /tmp/eri-ci-pricing.sqlite3
          ERI_PAYMENT_MODE: static_momo
          ERI_CORS_ORIGINS: https://eri-store-web.onrender.com
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app
          client = TestClient(app)
          h = {"X-ERI-Admin-Key": "ci-test-admin-secret-123456789-0123456789"}
          m = client.post("/api/v1/admin/ipa", headers=h, json={
              "name":"Mod Example", "version":"1.0", "bundle_id":"com.eri.example",
              "download_url":"https://example.org/test.ipa", "sha256":"a"*64,
              "authorized":True, "price_vnd":300000
          })
          a = client.post("/api/v1/admin/products", headers=h, json={
              "name":"AI Example", "description":"Giao sau khi thanh toán", "price_vnd":100000
          })
          c = client.post("/api/v1/admin/certificates", headers=h, json={
              "name":"Cert Example", "issuer":"Seller", "description":"Giao thủ công",
              "price_vnd":200000
          })
          assert all(x.status_code == 201 for x in (m,a,c)), (m.text,a.text,c.text)
          assert client.get("/api/v1/mods").json()["items"][0]["price_vnd"] == 300000
          assert client.get("/api/v1/products").json()["items"][0]["price_vnd"] == 130000
          assert client.get("/api/v1/certificates").json()["items"][0]["price_vnd"] == 260000
          # FREE vs MUA IPA uploads. Only FREE products allow a public file
          # download; even a valid paid upload ID must return 404.
          from io import BytesIO
          import zipfile, plistlib
          blob=BytesIO()
          with zipfile.ZipFile(blob,"w",zipfile.ZIP_DEFLATED) as z:
              z.writestr("Payload/Test.app/Info.plist",plistlib.dumps({
                  "CFBundleIdentifier":"com.eri.freemod",
                  "CFBundleShortVersionString":"1.0"
              }))
              z.writestr("Payload/Test.app/test.bin",b"owned sample")
          ipa_data=blob.getvalue()
          def upload_mod(price,label):
              result=client.post("/api/v1/admin/upload-sessions",headers=h,json={
                  "kind":"ipa","filename":label+".ipa","size_bytes":len(ipa_data),
                  "name":label,"description":"Test IPA","price_vnd":price,"authorized":True
              })
              assert result.status_code==201,result.text
              path="/api/v1/admin/upload-sessions/"+result.json()["upload_id"]
              updated=client.put(path,headers={**h,"X-ERI-Upload-Offset":"0",
                  "Content-Type":"application/octet-stream"},content=ipa_data)
              assert updated.status_code==200,updated.text
              assert updated.json()["offset"]==len(ipa_data)
              done=client.post(path+"/complete",headers=h)
              assert done.status_code==201,done.text
              return done.json()["id"]
          free_id=upload_mod(0,"Free IPA Example")
          paid_id=upload_mod(250000,"Paid IPA Example")
          mods=client.get("/api/v1/mods").json()["items"]
          free_mod=next(x for x in mods if x["id"]==free_id)
          paid_mod=next(x for x in mods if x["id"]==paid_id)
          assert free_mod["price_vnd"]==0
          assert free_mod["download_path"]=="/api/v1/mods/"+str(free_id)+"/download"
          assert paid_mod["price_vnd"]==250000
          assert paid_mod["download_path"] is None
          free_get=client.get(free_mod["download_path"])
          assert free_get.status_code==200,free_get.text
          assert free_get.content==ipa_data
          assert free_get.headers.get("content-disposition","").startswith("attachment;")
          assert client.get("/api/v1/mods/"+str(paid_id)+"/download").status_code==404
          assert client.get("/api/v1/mods/"+str(m.json()["id"])+"/download").status_code==404
          assert client.get("/api/v1/mods/0/download").status_code==404
          assert client.post("/api/v1/admin/upload-sessions",headers=h,json={
              "kind":"certificate","filename":"test.zip","size_bytes":64,
              "name":"Free certificate","issuer":"Test","price_vnd":0
          }).status_code==422
          print("FREE/MUA Mod Game listing, public free IPA download and paid file protection: OK")
          register = client.post("/api/v1/auth/register", json={
              "username":"testbuyer", "password":"LongSecurePassword2026!",
              "display_name":"T", "contact":"Zalo: testbuyer"
          })
          assert register.status_code == 201, register.text
          assert register.json()["customer"]["display_name"] == "T"
          auth = {"Authorization":"Bearer " + register.json()["token"]}
          free_order=client.post("/api/v1/orders",headers=auth,json={
              "kind":"mod","product_id":free_id
          })
          assert free_order.status_code == 422,free_order.text
          paid_order=client.post("/api/v1/orders",headers=auth,json={
              "kind":"mod","product_id":paid_id
          })
          assert paid_order.status_code == 201,paid_order.text
          assert paid_order.json()["amount_vnd"] == 250000
          # Clean up the test paid order so existing full-purge assertions
          # retain exactly three orders for testbuyer.
          with __import__("app").connection() as db:
              db.execute("DELETE FROM orders WHERE id=?", (paid_order.json()["id"],))

          for kind, item, amount in [("mod",m,300000),("ai",a,130000),("certificate",c,260000)]:
              order = client.post("/api/v1/orders", headers=auth,
                                  json={"kind":kind,"product_id":item.json()["id"]})
              assert order.status_code == 201, order.text
              assert order.json()["amount_vnd"] == amount, (kind,order.text)
          # Customer-to-customer isolation and a real uploaded file delivery.
          ordered = order.json()
          order_id = ordered["id"]
          sample = b"ERI owned order delivery sample (not a real certificate)"
          sample_file = "certificate.txt"
          base = "/api/v1/admin/orders/" + order_id + "/delivery-sessions"
          assert client.post(base, json={
              "filename":sample_file,"size_bytes":len(sample)
          }).status_code == 403
          assert client.post(base,headers=h,json={
              "filename":sample_file,"size_bytes":len(sample)
          }).status_code == 409, "Cannot deliver to unpaid buyer"

          # Another customer must not access any of the buyer's order data.
          another = client.post("/api/v1/auth/register",json={
              "username":"differentbuyer","password":"DifferentLongPassword2026!",
              "display_name":"Khách thứ hai","contact":"Zalo: differentbuyer"
          })
          assert another.status_code == 201, another.text
          other_auth={"Authorization":"Bearer "+another.json()["token"]}
          # Certificate UDID collection is opt-in, order-scoped and admin-only.
          import plistlib, subprocess
          from urllib.parse import urlparse
          from pathlib import Path
          ca = Path("apple_iphone_device_ca.pem")
          assert ca.exists()
          assert subprocess.run(["openssl","x509","-in",str(ca),"-noout"],
                                capture_output=True).returncode == 0
          certificate_id=order_id
          scan_root="/api/v1/me/certificate-orders/"+certificate_id+"/udid-sessions"
          assert client.post(scan_root,json={}).status_code == 401
          assert client.post(scan_root,headers=other_auth,json={}).status_code == 404
          new_scan=client.post(scan_root,headers=auth,json={})
          assert new_scan.status_code == 201,new_scan.text
          token=new_scan.json()["scan_token"]
          profile_path=urlparse(new_scan.json()["profile_url"]).path
          profile=client.get(profile_path)
          assert profile.status_code == 200,profile.text
          # iOS Safari should navigate to a .mobileconfig resource with the
          # Apple profile MIME, not a forced generic attachment download.
          assert profile_path.endswith("/ERI-STORE-UDID.mobileconfig")
          assert profile.headers["content-type"].startswith("application/x-apple-aspen-config")
          assert "content-disposition" not in profile.headers
          assert profile.headers["cache-control"] == "no-store"
          legacy=client.get("/api/v1/cert-udid/profile/"+token)
          assert legacy.status_code == 200,legacy.text
          assert legacy.headers["content-type"].startswith("application/x-apple-aspen-config")
          p=plistlib.loads(profile.content)
          assert p["PayloadType"] == "Profile Service"
          assert p["PayloadContent"]["DeviceAttributes"] == ["UDID"]
          assert p["PayloadContent"]["Challenge"] == token
          assert p["PayloadContent"]["URL"].startswith("https://eri-api-dag8.onrender.com/")
          qr=client.get(urlparse(new_scan.json()["qr_url"]).path)
          assert qr.status_code == 200 and b"<svg" in qr.content
          status_path=scan_root+"/"+token
          assert client.get(status_path,headers=other_auth).status_code == 404
          assert client.get(status_path,headers=auth).json()["complete"] is False
          spoof=client.post("/api/v1/cert-udid/callback/"+token,
                           headers={"Content-Type":"application/pkcs7-mime"},
                           content=b"Unsigned XML is not an Apple CMS signature")
          assert spoof.status_code == 422,spoof.text
          assert client.get(status_path,headers=auth).json()["complete"] is False
          # The real iPhone sent a valid signed callback twice: first a 303,
          # then a 409. Simulate an already-verified CMS payload to test
          # the redirect and replay behavior without weakening production CMS.
          from unittest.mock import patch
          from app import connection
          signed_attributes={
              "UDID":"00008020-001830D911A2002E", "CHALLENGE":token
          }
          callback="/api/v1/cert-udid/callback/"+token
          with patch("udid_routes._verify_apple_cms",return_value=signed_attributes) as verified:
              first_scan=client.post(callback,headers={
                  "Content-Type":"application/pkcs7-mime"
              },content=b"mock-valid-signed-cms",follow_redirects=False)
              assert first_scan.status_code == 301,first_scan.text
              assert first_scan.headers["location"] == "https://eri-store-web.onrender.com/?udid_scan=complete"
              assert first_scan.headers["cache-control"] == "no-store"
              assert token not in first_scan.headers["location"]
              assert "00008020" not in first_scan.headers["location"]
              retry_scan=client.post(callback,headers={
                  "Content-Type":"application/pkcs7-mime"
              },content=b"same-cms-retry",follow_redirects=False)
              assert retry_scan.status_code == 301,retry_scan.text
              assert verified.call_count == 1, "Completed retry must not verify again"
          assert client.get(status_path,headers=auth).json()["complete"] is True
          with connection() as db:
              saved=db.execute("SELECT udid,source FROM cert_order_udids WHERE order_id=?",
                               (certificate_id,)).fetchone()
              assert saved["source"] == "apple_profile"
          assert client.get(profile_path).status_code == 409
          manual_path="/api/v1/me/certificate-orders/"+certificate_id+"/udid"
          manual_value="00008020-001830D911A2002E"
          assert client.put(manual_path,headers=other_auth,
                            json={"udid":manual_value,"consent":True}).status_code == 404
          assert client.put(manual_path,headers=auth,
                            json={"udid":manual_value,"consent":False}).status_code == 422
          assert client.put(manual_path,headers=auth,
                            json={"udid":"INVALID-UDID","consent":True}).status_code == 422
          accepted=client.put(manual_path,headers=auth,
                              json={"udid":manual_value,"consent":True})
          assert accepted.status_code == 200,accepted.text
          assert accepted.json()["source"]=="self_reported"
          fetched=client.get("/api/v1/orders/"+certificate_id,headers=auth).json()
          assert fetched["device_udid"]==manual_value
          assert fetched["device_udid_source"]=="self_reported"
          private_admin=client.get("/api/v1/admin/certificate-udids")
          assert private_admin.status_code == 403
          admin_data=client.get("/api/v1/admin/certificate-udids",headers=h)
          assert admin_data.status_code == 200,admin_data.text
          assert any(x["order_id"]==certificate_id and x["udid"]==manual_value
                     for x in admin_data.json()["items"])
          assert client.delete(manual_path,headers=other_auth).status_code == 404
          assert client.delete(manual_path,headers=auth).status_code == 200
          assert "device_udid" not in client.get("/api/v1/orders/"+certificate_id,headers=auth).json()
          # Resubmit to verify full account purge removes UDID data too.
          assert client.put(manual_path,headers=auth,
                            json={"udid":manual_value,"consent":True}).status_code == 200
          print("UDID profile challenge, QR, scoped manual fallback, signed CMS rejection and admin permissions: OK")

          assert client.get("/api/v1/orders/"+order_id,headers=other_auth).status_code == 404

          paid=client.post("/api/v1/admin/orders/"+order_id+"/status",
              headers=h,json={"status":"paid","transaction_reference":"MOMO_DELIVERY_TEST_1234"})
          assert paid.status_code == 200,paid.text

          begin=client.post(base,headers=h,json={
              "filename":sample_file,"size_bytes":len(sample)
          })
          assert begin.status_code == 201,begin.text
          upload_id=begin.json()["upload_id"]
          path=base+"/"+upload_id
          half=len(sample)//2
          denied=client.put(path,headers={"X-ERI-Upload-Offset":"0"},content=sample[:half])
          assert denied.status_code == 403
          wrong=client.put(path,headers={**h,"X-ERI-Upload-Offset":"5"},content=sample[:half])
          assert wrong.status_code == 409
          first=client.put(path,headers={**h,"X-ERI-Upload-Offset":"0"},content=sample[:half])
          assert first.status_code == 200,first.text
          assert client.get(path,headers=h).json()["offset"] == half
          second=client.put(path,headers={**h,"X-ERI-Upload-Offset":str(half)},
                            content=sample[half:])
          assert second.status_code == 200,second.text
          finished=client.post(path+"/complete",headers=h)
          assert finished.status_code == 201,finished.text
          assert finished.json()["status"] == "fulfilled"
          file_url="/api/v1/me/orders/"+order_id+"/delivery"
          assert client.get(file_url).status_code == 401
          assert client.get(file_url,headers=other_auth).status_code == 404
          received=client.get(file_url,headers=auth)
          assert received.status_code == 200 and received.content == sample
          assert received.headers["cache-control"] == "private, no-store"
          assert received.headers["content-disposition"].startswith("attachment;")
          own=client.get("/api/v1/orders/"+order_id,headers=auth).json()
          assert own["status"] == "fulfilled"
          assert own["delivery"]["filename"] == sample_file
          assert own["delivery"]["download_path"] == file_url
          mine=client.get("/api/v1/me/orders",headers=auth).json()["items"]
          assert any(x["id"] == order_id and x["delivery"]["filename"] == sample_file for x in mine)
          assert "delivery" not in client.get("/api/v1/products").text
          admin_orders=client.get("/api/v1/admin/orders",headers=h).json()["items"]
          assert any(x["id"] == order_id and x["delivery_filename"] == sample_file for x in admin_orders)
          assert client.post(base,headers=h,json={
              "filename":sample_file,"size_bytes":len(sample)
          }).status_code == 409
          # Admin-only account management; do not leak users publicly.
          # Full account purge: delete profile, ALL orders, delivered files
          # and login sessions, without affecting any other customer.
          from app import UPLOAD_DIR, connection
          users=client.get("/api/v1/admin/customers",headers=h)
          assert users.status_code == 200,users.text
          by_username={x["username"]:x for x in users.json()["items"]}
          assert {"testbuyer","differentbuyer"} <= set(by_username)
          first_id=by_username["testbuyer"]["id"]
          second_id=by_username["differentbuyer"]["id"]
          assert by_username["testbuyer"]["order_count"] == 3
          assert client.get("/api/v1/admin/customers").status_code == 403
          assert client.request("DELETE",f"/api/v1/admin/customers/{first_id}",json={
              "confirm_username":"testbuyer"
          }).status_code == 403
          no_confirm=client.request("DELETE",f"/api/v1/admin/customers/{first_id}",headers=h)
          assert no_confirm.status_code == 422
          wrong=client.request("DELETE",f"/api/v1/admin/customers/{first_id}",headers=h,json={
              "confirm_username":"differentbuyer"
          })
          assert wrong.status_code == 422,wrong.text
          assert client.get("/api/v1/auth/me",headers=auth).status_code == 200

          with connection() as db:
              delivery_record=db.execute("SELECT storage_name FROM order_deliveries WHERE order_id=?",
                                         (order_id,)).fetchone()
          assert delivery_record is not None
          delivery_file=UPLOAD_DIR/delivery_record["storage_name"]
          assert delivery_file.is_file()
          purge=client.request("DELETE",f"/api/v1/admin/customers/{first_id}",headers=h,json={
              "confirm_username":"testbuyer"
          })
          assert purge.status_code == 200,purge.text
          assert purge.json()["deleted_orders"] == 3
          assert purge.json()["deleted_delivery_files"] == 1
          assert not delivery_file.exists()
          assert client.get("/api/v1/auth/me",headers=auth).status_code == 401
          assert client.get("/api/v1/me/orders",headers=auth).status_code == 401
          assert client.get("/api/v1/orders/"+order_id,headers=auth).status_code == 401
          assert client.get("/api/v1/me/orders/"+order_id+"/delivery",headers=auth).status_code == 401
          assert client.get("/api/v1/auth/me",headers=other_auth).status_code == 200
          assert client.get("/api/v1/admin/customers",headers=h).json()["items"][0]["username"] == "differentbuyer"
          with connection() as db:
              assert db.execute("SELECT COUNT(*) FROM customers WHERE id=?",(first_id,)).fetchone()[0] == 0
              assert db.execute("SELECT COUNT(*) FROM cert_order_udids WHERE customer_id=?",
                                (first_id,)).fetchone()[0] == 0
              assert db.execute("SELECT COUNT(*) FROM cert_udid_sessions WHERE customer_id=?",
                                (first_id,)).fetchone()[0] == 0
              assert db.execute("SELECT COUNT(*) FROM customer_sessions WHERE customer_id=?",
                                (first_id,)).fetchone()[0] == 0
              assert db.execute("SELECT COUNT(*) FROM orders WHERE customer_id=?",
                                (first_id,)).fetchone()[0] == 0
              assert db.execute("SELECT COUNT(*) FROM orders WHERE id=?",(order_id,)).fetchone()[0] == 0
              assert db.execute("SELECT COUNT(*) FROM order_deliveries WHERE order_id=?",
                                (order_id,)).fetchone()[0] == 0
          # Even pending orders are deleted, not anonymized.
          pending=client.post("/api/v1/orders",headers=other_auth,json={
              "kind":"mod","product_id":m.json()["id"]
          })
          assert pending.status_code == 201,pending.text
          wipe_pending=client.request("DELETE",f"/api/v1/admin/customers/{second_id}",headers=h,json={
              "confirm_username":"differentbuyer"
          })
          assert wipe_pending.status_code == 200,wipe_pending.text
          assert wipe_pending.json()["deleted_orders"] == 1
          assert client.get("/api/v1/auth/me",headers=other_auth).status_code == 401
          with connection() as db:
              assert db.execute("SELECT COUNT(*) FROM orders WHERE id=?",
                                (pending.json()["id"],)).fetchone()[0] == 0
              assert db.execute("SELECT COUNT(*) FROM customers").fetchone()[0] == 0
          print("Full account purge, all order statuses, deleted files, session revocation and isolation: OK")
          print("Private paid-order file delivery and buyer isolation: OK")
          print("Mod Game original price; AI and certificate 30% markup: OK")
          PY
  web-check:
    name: Validate website and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node --check web/eri-store/app.js
          grep -q 'id="mod-subtabs"' web/eri-store/index.html
          grep -q 'data-mod-mode="free"' web/eri-store/index.html
          grep -q 'data-mod-mode="paid"' web/eri-store/index.html
          grep -q 'free?"FREE":money(item.price_vnd)' web/eri-store/app.js
          grep -q '/api/v1/mods/' web/eri-store/app.js
          node --check web/eri-store/udid.js
          grep -q 'id="certificate-udid"' web/eri-store/index.html
          grep -q 'id="start-udid"' web/eri-store/index.html
          grep -q 'src="/udid.js"' web/eri-store/index.html
          grep -q 'udidHandleProfileReturn' web/eri-store/udid.js
          grep -q 'udidStandalone' web/eri-store/udid.js
          grep -q 'udidRemember' web/eri-store/udid.js
          grep -q 'if(udidPanel)udidPanel.classList.toggle' web/eri-store/app.js
          test -s backend/udid_routes.py
          test -s backend/apple_iphone_device_ca.pem
          python3 -m json.tool web/eri-store/manifest.webmanifest >/dev/null
          test -s web/eri-store/index.html
          test -s web/eri-store/styles.css
          test -s web/eri-store/icon.svg
          test -s web/eri-store/service-worker.js
          node --check web/eri-store/service-worker.js

  live-smoke:
    name: Check deployed ERI STORE and API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live API routes, PWA and CORS preflight
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error
          api = "https://eri-api-dag8.onrender.com"
          site = "https://eri-store-web.onrender.com"
          def fetch(url, method="GET", headers=None):
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, method=method, headers=headers or {})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return response.status, dict(response.headers), response.read()
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(8)
              raise RuntimeError("Remote service not reachable: " + str(last))
          code, _, body = fetch(api + "/health")
          assert code == 200 and json.loads(body)["status"] == "ok"
          _, _, schema_body = fetch(api + "/openapi.json")
          endpoints = json.loads(schema_body)["paths"]
          for route in [
              "/api/v1/auth/register", "/api/v1/auth/login",
              "/api/v1/auth/me", "/api/v1/me/orders",
              "/api/v1/orders", "/api/v1/payment/momo-qr"
          ]:
              assert route in endpoints, route
          preflight_headers = {
              "Origin": site,
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "content-type,authorization"
          }
          code, headers, _ = fetch(api + "/api/v1/auth/register",
                                   method="OPTIONS", headers=preflight_headers)
          assert code == 200, code
          allow = {k.lower(): v for k, v in headers.items()}
          assert allow.get("access-control-allow-origin") == site, allow
          assert "POST" in allow.get("access-control-allow-methods", ""), allow
          assert "authorization" in allow.get("access-control-allow-headers", "").lower(), allow
          _, _, home = fetch(site + "/")
          assert b"ERI STORE" in home
          _, _, manifest = fetch(site + "/manifest.webmanifest")
          assert json.loads(manifest)["display"] == "standalone"
          print("Live website, API auth routes, and browser CORS preflight: OK")
          PY
