name: ERI ADMIN Free IPA upload speed and background compatibility

on:
  push:
    branches:
      - fix/free-supabase-ipa-upload-speed-20261119
    paths:
      - 'apps/ERIAdmin/**'
      - 'backend/**'
      - '.github/workflows/test-free-ipa-speed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eri-capacity-aware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx
      - name: Validate large file limits and existing chunk uploads
        working-directory: backend
        run: |
          python test_large_ipa_limits.py
          python test_r2_large_mods.py
          python test_upload_reservations.py
          python test_fast_upload.py
          python test_eri_atomic_snapshot.py
          python -m unittest -v test_eri_vault.py test_eri_persistence.py test_live_storage_migration.py
      - name: Syntax check
        run: python -m py_compile backend/app.py backend/eri_vault.py backend/test_large_ipa_limits.py backend/eri_r2_mods.py backend/test_r2_large_mods.py

  ios-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Guard Free background-upload compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/ERIAdmin/ERIBackgroundUploader.swift').read_text()
          ui=Path('apps/ERIAdmin/ERIAdminApp.swift').read_text()
          assert 'config.httpMaximumConnectionsPerHost = 2' in s
          assert 'showTotalProgress(for: current)' in s
          assert 'inFlightBytes' in s
          assert 'eri.background.upload.record.v1' in s
          assert 'com.eringuyen.admin.background-upload.v1' in s
          assert 'X-ERI-Chunk-SHA256' in s
          assert 'fast-parts/' in s
          assert 'String(confirmed.count) + "/" + String(current.partCount)' not in s
          assert 'Tiến độ toàn bộ tệp' in ui
          print('Background resume, checksum and one-bar UI guards: OK')
          PY
      - name: Generate unsigned Admin project
        shell: bash
        run: |
          mkdir -p build-project/Sources
          cp apps/ERIAdmin/ERIAdminApp.swift build-project/Sources/App.swift
          cp apps/ERIAdmin/ERIBackgroundUploader.swift build-project/Sources/ERIBackgroundUploader.swift
          cat > build-project/project.yml <<'EOF'
          name: ERIAdmin
          options:
            deploymentTarget:
              iOS: '16.0'
          targets:
            ERIAdmin:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.eringuyen.admin
                  PRODUCT_NAME: ERIAdmin
                  INFOPLIST_KEY_CFBundleDisplayName: 'ERI ADMIN'
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  SWIFT_VERSION: '5.0'
                  TARGETED_DEVICE_FAMILY: '1,2'
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF
          cd build-project
          xcodegen generate
      - name: Build unsigned iOS app
        shell: bash
        run: |
          xcrun swiftc -frontend -parse build-project/Sources/App.swift
          xcrun swiftc -frontend -parse build-project/Sources/ERIBackgroundUploader.swift
          cd build-project
          xcodebuild -project ERIAdmin.xcodeproj -scheme ERIAdmin -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath derived CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p payload/Payload
          cp -R build-project/derived/Build/Products/Release-iphoneos/ERIAdmin.app payload/Payload/
          cd payload && zip -qr ../ERIAdmin-free-fast-upload-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ERIAdmin-free-fast-upload-unsigned-IPA
          path: ERIAdmin-free-fast-upload-unsigned.ipa

  publish-release:
    name: Publish unsigned IPA for iPhone signing
    needs: [api-tests, ios-compile]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ERIAdmin-free-fast-upload-unsigned-IPA
          path: dist
      - name: Publish or refresh Free upload release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=eri-admin-free-fast-20261119
          file=dist/ERIAdmin-free-fast-upload-unsigned.ipa
          test -s "$file"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$file" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ERI ADMIN – Free IPA upload speed" \
              --notes "ERi ADMIN iOS: 2 concurrent bounded 4-MiB background transfers to existing Render/Supabase, whole-file progress, checksum-verified resumable upload. No R2 required. IPA is UNSIGNED: sign with a valid iOS certificate before installation. Does not update the Render backend or restore older missing data."
          fi
