name: Verify live ERI Store after independent-catalog fix
on:
  push:
    branches: [fix/shop-catalog-independent-of-admin]
    paths: [.github/workflows/check-live-shop-availability.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public API and Safari catalog without any Admin session
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          api="https://eri-api-dag8.onrender.com"
          site="https://eri-store-web.onrender.com"
          def get(url, timeout=20):
              req=urllib.request.Request(url,headers={"User-Agent":"ERI-store-public-smoke/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  assert response.status==200, (url,response.status)
                  return response.read()
          for i in range(4):
              try:
                  health=json.loads(get(api+"/health",timeout=30))
                  assert health.get("status")=="ok"
                  break
              except Exception:
                  if i==3: raise
                  time.sleep(5)
          for name,path in [("Mod Game","/api/v1/mods"),("AI Plus","/api/v1/products"),("Chứng chỉ","/api/v1/certificates")]:
              started=time.monotonic()
              result=json.loads(get(api+path,timeout=20))
              elapsed=time.monotonic()-started
              assert isinstance(result.get("items"),list), name
              print(f"{name}: HTTP 200, {len(result['items'])} products, {elapsed:.2f} seconds")
              if name=="Mod Game":
                  segments={}
                  for item in result["items"]:
                      platform=item.get("platform","unknown")
                      mode="FREE" if int(item.get("price_vnd",0))==0 else "BÁN"
                      segment=platform+"/"+mode
                      segments[segment]=segments.get(segment,0)+1
                  print("MOD BREAKDOWN: "+json.dumps(segments,ensure_ascii=False))
              assert elapsed<15, name+" public catalog too slow after health warmup"
          page=get(site+"/?eri_live_catalog=1",timeout=20).decode("utf-8")
          assert "app.js?v=20261121catalogfast1" in page
          js=get(site+"/app.js?v=20261121catalogfast1",timeout=20).decode("utf-8")
          assert "function loadPublicCatalogWithRetry" in js
          assert "timeoutMs:10000" in js
          print("LIVE VERIFIED: products visible independently of ERI ADMIN and no infinite skeleton")
          PY
