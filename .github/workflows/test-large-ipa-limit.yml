name: Validate staged 2 GiB IPA upload

on:
  push:
    branches:
      - fix/large-ipa-upload-2g-20261118
    paths:
      - 'apps/ERIAdmin/**'
      - 'backend/**'
      - '.github/workflows/test-large-ipa-limit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx
      - name: Validate large file limits and existing chunk uploads
        working-directory: backend
        run: |
          python test_large_ipa_limits.py
          python test_fast_upload.py
          python -m unittest -v test_eri_vault.py
      - name: Syntax check
        run: python -m py_compile backend/app.py backend/eri_vault.py backend/test_large_ipa_limits.py

  ios-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate unsigned Admin project
        shell: bash
        run: |
          mkdir -p build-project/Sources
          cp apps/ERIAdmin/ERIAdminApp.swift build-project/Sources/App.swift
          cp apps/ERIAdmin/ERIBackgroundUploader.swift build-project/Sources/ERIBackgroundUploader.swift
          cat > build-project/project.yml <<'EOF'
          name: ERIAdmin
          options:
            deploymentTarget:
              iOS: '16.0'
          targets:
            ERIAdmin:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.eringuyen.admin
                  PRODUCT_NAME: ERIAdmin
                  INFOPLIST_KEY_CFBundleDisplayName: 'ERI ADMIN'
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  SWIFT_VERSION: '5.0'
                  TARGETED_DEVICE_FAMILY: '1,2'
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF
          cd build-project
          xcodegen generate
      - name: Build unsigned iOS app
        shell: bash
        run: |
          xcrun swiftc -frontend -parse build-project/Sources/App.swift
          xcrun swiftc -frontend -parse build-project/Sources/ERIBackgroundUploader.swift
          cd build-project
          xcodebuild -project ERIAdmin.xcodeproj -scheme ERIAdmin -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath derived CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p payload/Payload
          cp -R build-project/derived/Build/Products/Release-iphoneos/ERIAdmin.app payload/Payload/
          cd payload && zip -qr ../ERIAdmin-2GiB-staging-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ERIAdmin-2GiB-staging-unsigned-IPA
          path: ERIAdmin-2GiB-staging-unsigned.ipa
