name: Test ERI persistent storage staging
on:
  push:
    branches:
      - fix/eri-persistent-storage
    paths:
      - backend/eri_vault.py
      - backend/test_eri_vault.py
      - backend/test_eri_persistence.py
      - backend/migrate_live_storage.py
      - backend/test_live_storage_migration.py
      - backend/app.py
      - backend/decrypt_catalog.py
      - .github/workflows/test-eri-vault.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install httpx2==2.13.0
      - run: cd backend && python -m unittest -v test_eri_vault.py test_eri_persistence.py test_live_storage_migration.py
      - run: python -m py_compile backend/eri_vault.py backend/app.py backend/decrypt_catalog.py
