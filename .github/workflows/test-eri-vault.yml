name: Test ERI persistent storage staging
on:
  push:
    branches:
      - fix/eri-persistent-storage
    paths:
      - backend/eri_vault.py
      - backend/test_eri_vault.py
      - .github/workflows/test-eri-vault.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd backend && python -m unittest -v test_eri_vault.py
      - run: python -m py_compile backend/eri_vault.py
