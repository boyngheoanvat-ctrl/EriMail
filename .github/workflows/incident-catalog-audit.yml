name: ERI STORE read-only production catalog audit

on:
  push:
    branches:
      - incident/catalog-recovery-audit-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check store JavaScript syntax (no live writes)
        run: node --check web/eri-store/app.js
      - name: Check production CORS for Safari store without customer data
        run: |
          python - <<'PY'
          import urllib.request
          url="https://eri-api-dag8.onrender.com/api/v1/mods"
          origin="https://eri-store-web.onrender.com"
          req=urllib.request.Request(url,headers={"Origin":origin,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=50) as res:
                  allowed=res.headers.get("Access-Control-Allow-Origin","")
                  print("API GET status:",res.status)
                  print("Storefront CORS:", "OK" if allowed==origin else "MISSING")
          except Exception as exc:
              print("CORS CHECK UNAVAILABLE:",type(exc).__name__)
          PY
      - name: Count existing production listings without reading private records
        env:
          ERI_API: https://eri-api-dag8.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["ERI_API"].rstrip("/")
          paths = {
              "ipa_and_apk": "/api/v1/ipa",
              "ai_products": "/api/v1/products",
              "certificates": "/api/v1/certificates",
          }
          counts = {}
          for label, path in paths.items():
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          base + path, headers={"Accept": "application/json"}
                      )
                      with urllib.request.urlopen(req, timeout=60) as response:
                          if response.status != 200:
                              raise RuntimeError("HTTP status " + str(response.status))
                          payload = json.load(response)
                      items = payload.get("items")
                      if not isinstance(items, list):
                          raise ValueError("Missing expected items list")
                      counts[label] = len(items)
                      print(f"{label}: {len(items)} published items (API limit 100)")
                      if label == "ipa_and_apk":
                          breakdown = {}
                          for item in items:
                              platform = item.get("platform", "unknown")
                              tier = "FREE" if item.get("price_vnd") == 0 else "PAID"
                              key = str(platform) + "_" + tier
                              breakdown[key] = breakdown.get(key, 0) + 1
                          print("IPA/APK breakdown:", json.dumps(breakdown, sort_keys=True))
                      break
                  except (urllib.error.URLError, ValueError, RuntimeError) as exc:
                      if attempt == 2:
                          print(f"{label}: unavailable ({type(exc).__name__})")
                          counts[label] = None
                      else:
                          time.sleep(5)
          with open("eri-production-counts.json", "w", encoding="utf-8") as f:
              json.dump(counts, f, indent=2, ensure_ascii=False)
          if all(value is None for value in counts.values()):
              raise SystemExit("All public catalog checks failed; no DB changes made")
          PY
      - name: Save non-sensitive counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eri-production-catalog-counts
          path: eri-production-counts.json
          if-no-files-found: ignore
          retention-days: 30
