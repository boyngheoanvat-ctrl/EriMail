name: ERI STORE read-only production catalog audit

on:
  push:
    branches:
      - incident/catalog-recovery-audit-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Count existing production listings without reading private records
        env:
          ERI_API: https://eri-api-dag8.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["ERI_API"].rstrip("/")
          paths = {
              "ipa_and_apk": "/api/v1/ipa",
              "ai_products": "/api/v1/products",
              "certificates": "/api/v1/certificates",
          }
          counts = {}
          for label, path in paths.items():
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          base + path, headers={"Accept": "application/json"}
                      )
                      with urllib.request.urlopen(req, timeout=60) as response:
                          if response.status != 200:
                              raise RuntimeError("HTTP status " + str(response.status))
                          payload = json.load(response)
                      items = payload.get("items")
                      if not isinstance(items, list):
                          raise ValueError("Missing expected items list")
                      counts[label] = len(items)
                      print(f"{label}: {len(items)} published items (API limit 100)")
                      break
                  except (urllib.error.URLError, ValueError, RuntimeError) as exc:
                      if attempt == 2:
                          print(f"{label}: unavailable ({type(exc).__name__})")
                          counts[label] = None
                      else:
                          time.sleep(5)
          with open("eri-production-counts.json", "w", encoding="utf-8") as f:
              json.dump(counts, f, indent=2, ensure_ascii=False)
          if all(value is None for value in counts.values()):
              raise SystemExit("All public catalog checks failed; no DB changes made")
          PY
      - name: Save non-sensitive counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eri-production-catalog-counts
          path: eri-production-counts.json
          if-no-files-found: ignore
          retention-days: 30
