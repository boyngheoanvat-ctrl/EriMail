name: ERI ADMIN incident catalog all-items iOS build

on:
  push:
    branches:
      - incident/catalog-recovery-audit-20261119
    paths:
      - 'apps/ERIAdmin/**'
      - 'backend/**'
      - '.github/workflows/incident-ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eri-capacity-aware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate unsigned Admin project
        shell: bash
        run: |
          mkdir -p build-project/Sources
          cp apps/ERIAdmin/ERIAdminApp.swift build-project/Sources/App.swift
          cp apps/ERIAdmin/ERIBackgroundUploader.swift build-project/Sources/ERIBackgroundUploader.swift
          cat > build-project/project.yml <<'EOF'
          name: ERIAdmin
          options:
            deploymentTarget:
              iOS: '16.0'
          targets:
            ERIAdmin:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.eringuyen.admin
                  PRODUCT_NAME: ERIAdmin
                  INFOPLIST_KEY_CFBundleDisplayName: 'ERI ADMIN'
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  SWIFT_VERSION: '5.0'
                  TARGETED_DEVICE_FAMILY: '1,2'
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF
          cd build-project
          xcodegen generate
      - name: Build unsigned iOS app
        shell: bash
        run: |
          xcrun swiftc -frontend -parse build-project/Sources/App.swift
          xcrun swiftc -frontend -parse build-project/Sources/ERIBackgroundUploader.swift
          cd build-project
          xcodebuild -project ERIAdmin.xcodeproj -scheme ERIAdmin -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath derived CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p payload/Payload
          cp -R build-project/derived/Build/Products/Release-iphoneos/ERIAdmin.app payload/Payload/
          cd payload && zip -qr ../ERIAdmin-catalog-visibility-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ERIAdmin-capacity-aware-unsigned-IPA
          path: ERIAdmin-capacity-aware-unsigned.ipa
