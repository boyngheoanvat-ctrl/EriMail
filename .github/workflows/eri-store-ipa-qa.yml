name: ERI STORE native IPA worker and request checks

on:
  pull_request:
    paths:
      - 'web/eri-store/**'
      - 'backend/**'
      - 'f4bridge/**'
      - '.github/workflows/eri-store-ipa-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-ipa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect publicly listed ESign and KSign installer source (diagnostic)
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          import re
          urls=['https://website.khoindvn.io.vn/apps.js','https://khoindvn.io.vn/','https://khoindvn.com/']
          for url in urls:
              try:
                  with urlopen(Request(url, headers={'User-Agent':'Mozilla/5.0 ERIStore/1.0'}), timeout=16) as r:
                      body=r.read(500000).decode('utf-8','replace')
                      print('DIAG',url,'status',r.status,'type',r.headers.get('Content-Type'),'bytes',len(body))
                      if url.endswith('apps.js'):
                          print('HEAD',body[:1400].replace('\\n',' '))
                          import json,base64
                          m=re.search(r'window\\.apps\\s*=\\s*(\\{.*?\\})\\s*;',body,re.S)
                          if m:
                              try:
                                  apps=json.loads(m.group(1))
                                  slim={k:[{'name':x.get('name',''),'issuer':x.get('descriptions',''),'url':x.get('url','')} for x in v] for k,v in apps.items() if k in ('esign','ksign')}
                                  print('CERT_DATA_B64='+base64.b64encode(json.dumps(slim,ensure_ascii=False,separators=(',',':')).encode()).decode())
                                  print('CERT_COUNTS', {k:len(v) for k,v in slim.items()})
                                  for k in ('esign','ksign'):
                                      if slim.get(k):
                                          from urllib.parse import urlparse,parse_qs
                                          link=slim[k][0]['url']
                                          manifest=parse_qs(urlparse(link).query).get('url',[''])[0]
                                          try:
                                              with urlopen(Request(manifest,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as pr:
                                                  print('PLIST',k,pr.status,pr.headers.get('Content-Type'),pr.read(120)[:100])
                                          except Exception as e:
                                              print('PLIST ERROR',k,str(e)[:140])
                              except Exception as e:print('CERT_PARSE_ERROR',str(e)[:250])
                          for pat in ['itms-services','manifest.plist','ipa','esign','ksign','Viet Nam Rubber']:
                              ix=body.lower().find(pat.lower())
                              print('PATTERN',pat,'found',ix>=0,'context',body[max(0,ix-120):ix+300].replace('\\n',' ')[:420] if ix>=0 else '')
                          print('URLs',re.findall(r'https?://[^ ]{3,150}',body.replace(chr(10),' '))[:20])
              except Exception as e:
                  print('DIAG ERROR',url,str(e)[:250])
          PY
      - name: JavaScript syntax checks
        run: |
          node --check web/eri-store/ipa-tools.js
          node --check web/eri-store/sign-jobs.js
          node --check web/eri-store/decrypt-store.js
          node --check web/eri-store/service-worker.js
      - name: Verify upload percentage and missing IPA UI contracts
        run: python3 backend/test_eri_web_ipa_fixes.py
      - name: Test ERI F4 public catalog bridge
        run: python3 f4bridge/test_server.py
      - name: Test backend IPA request paths
        run: |
          python3 -m pip install -r backend/requirements.txt httpx
          cd backend
          python3 test_decrypt_catalog.py
          python3 test_actions_ipa_worker.py
          python3 test_actions_bridge.py
          python3 test_actions_r2_auto.py
          python3 test_signing_jobs.py
